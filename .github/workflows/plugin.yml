# The Sonic Pi plugin (app/plugin): built from a clean checkout.
#
# The plugin is four things built together: Sonic Pi's runtime (app/web/runtime, as a native library), the page
# it shows (app/web), the engine (app/external/supersonic, compiled into the plugin) and SuperSonic's JavaScript
# client, which the page uses to read the engine's memory. The client has to be the engine's own, so it is built
# here from the same checkout as the engine and not taken from a release.
name: Plugin

on:
  push:
    paths: ["app/plugin/**", "app/web/**", "app/external/supersonic", "etc/synthdefs/compiled/**", "etc/samples/**", "etc/buffers/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["app/plugin/**", "app/web/**", "app/external/supersonic", "etc/synthdefs/compiled/**", "etc/samples/**", "etc/buffers/**", ".github/workflows/plugin.yml"]

env:
  # What SuperSonic's own web build is made with (app/external/supersonic/.github/workflows/deploy.yml).
  EMSDK_VERSION: "4.0.21"
  RUST_NIGHTLY: nightly-2026-07-02
  WASM_BINDGEN_VERSION: "0.2.127"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: build · macOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"     # rake builds mruby; qt-doc.rb writes the tutorial the page shows
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      # Two Rust toolchains: the nightly SuperSonic's web build asks for by name, then stable, which is installed
      # last so that it is the default and the plugin is built with it.
      - name: Rust nightly, for SuperSonic's web build
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten
          components: rust-src
      - name: Rust stable, for the plugin
        uses: dtolnay/rust-toolchain@stable
      - name: wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: SuperSonic's client, from the engine's own checkout
        working-directory: app/external/supersonic
        run: |
          npm install
          ./scripts/build-web.sh --release

      - id: pins
        run: echo "mruby=$(git rev-parse HEAD:app/web/runtime/mruby)" >> "$GITHUB_OUTPUT"
      - name: Cache mruby
        uses: actions/cache@v4
        with:
          path: app/web/build/mruby
          # everything mruby is built from (app/web/scripts/build-runtime.sh, FROM), the gems it compiles in included
          key: mruby-${{ runner.os }}-${{ steps.pins.outputs.mruby }}-${{ hashFiles('app/web/runtime/build_config.rb', 'app/web/runtime/mruby-patches/**', 'app/web/runtime/mrbgems/**') }}
      - name: The tutorial, from the documentation in this repository
        working-directory: app/server/ruby
        run: |
          ruby bin/qt-doc.rb
          ruby bin/web-tutorial.rb
      - name: The runtime and the page
        working-directory: app/web
        run: |
          npm ci
          scripts/build-runtime.sh --native
          node scripts/build-app.mjs

      - name: Build the plugin
        working-directory: app/plugin
        env:
          SUPERSONIC_DIST: ${{ github.workspace }}/app/external/supersonic/dist
        run: scripts/build.sh

      # The offline tests only: they keep time from rendered frames, so their results do not depend on this
      # machine's speed. The live tests (test/sound.rs) and the test host render in real time and are run on a
      # developer's machine with scripts/build.sh --test.
      - name: Offline tests
        working-directory: app/plugin
        run: cargo test --release --test offline

      # pluginval (Tracktion's plugin checker) loads the bundle as a DAW would: at 44.1, 48 and 96 kHz with block
      # sizes from 64 to 1024, opening and closing its window, saving and restoring its state, and calling it from
      # other threads. It checks for crashes, hangs and wrong answers, not timing, so a slow runner does not change
      # the result. The version and the zip's SHA-256 are fixed, so a new pluginval release cannot change this job.
      # It exits non-zero when it finds no plugin at the path.
      - name: pluginval
        working-directory: app/plugin
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          echo "$PLUGINVAL_SHA256  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
          "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 10 --random-seed 1 --verbose --validate "dist/Sonic Pi.vst3"
      # auval (Apple's Audio Unit checker) does for the Audio Unit what pluginval does for the VST3. It only checks
      # a component the system has registered, so the bundle goes where a user's would and the registrar is
      # restarted to find it.
      - name: auval
        working-directory: app/plugin
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "dist/Sonic Pi.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu SPpl SnPi
      - name: The plugin's own logs, on a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-logs
          path: ~/Library/Logs/Sonic Pi/
