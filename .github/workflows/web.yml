# CI for Sonic Pi on the web and for the mruby runtime.
#
# Each spec records a trace: the synths triggered, their opts and their times, which is the OSC sent to the
# engine. If a spec's trace matches, the sound is the same. The runtime is one set of Ruby files built three
# ways: run by MRI, compiled into mruby and linked into a native program (where Sonic Pi itself is heading), and
# compiled to wasm for the browser. All three are checked against the same traces, and the native mruby build is
# checked on every OS Sonic Pi ships on.
name: Web

on:
  push:
    paths: ["app/web/**", "app/sharelink/**", "app/server/ruby/lib/**", "etc/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["app/web/**", "app/sharelink/**", "app/server/ruby/lib/**", "etc/**", ".github/workflows/web.yml"]

env:
  EMSDK_VERSION: "4.0.14"   # what the wasm is built with

defaults:
  run:
    working-directory: app/web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the runtime built with native mruby, on Linux, macOS and Windows ─────────────────────────────────────────
  runtime:
    name: Runtime specs, native mruby (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # keep the other OSes running when one fails, to see which OSes differ
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # app/web/runtime/mruby, needed to build mruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"     # rake builds mruby, and scripts/check.rb compares the traces
      - id: pins
        shell: bash
        run: echo "mruby=$(git rev-parse HEAD:app/web/runtime/mruby)" >> "$GITHUB_OUTPUT"
      - name: Cache mruby
        uses: actions/cache@v4
        with:
          path: app/web/build/mruby   # relative to the repository root: actions ignore the run steps' working directory
          # everything mruby is built from (scripts/build-runtime.sh, FROM), the gems it compiles in included
          key: mruby-${{ runner.os }}-${{ steps.pins.outputs.mruby }}-${{ hashFiles('app/web/runtime/build_config.rb', 'app/web/runtime/mruby-patches/**', 'app/web/runtime/mrbgems/**') }}
      - name: Build the runtime
        shell: bash
        run: scripts/build-runtime.sh --native
      - name: Run the specs on native mruby
        shell: bash
        run: ADAPTER="$PWD/build/runtime/sp-trace" ruby scripts/check.rb
      - name: Run every example and tutorial snippet with Safe mode on
        shell: bash
        run: ADAPTER="$PWD/build/runtime/sp-trace" ruby scripts/check-corpus.rb
      # The runner has no German locale, and the decimal-comma checks (runtime_host_check.cpp) skip without one.
      - name: Add a German locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8
      - name: Test the runtime in a native host
        # the way the plugin or app runs it: samples by path and from folders (native.rb), several runtimes at once
        shell: bash
        run: scripts/check-runtime-host.sh
      - name: Check the runtime runs with no Ruby on PATH
        # the runtime has mruby built in, so it must not need a Ruby installed on the machine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bare=$(echo "$PATH" | tr ':' '\n' | grep -v -i -E 'ruby|rbenv|rvm' | paste -sd: -)
          PATH="$bare" build/runtime/sp-trace specs/play/amp_and_pan.rb > /dev/null
          echo "traced with no ruby on PATH"

  # ── the runtime built as wasm, as the browser loads it ─────────────────────────────────────────────────────────
  wasm:
    name: Runtime specs, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        # a pinned version from emsdk's own repository, so a compiler update cannot change the wasm unnoticed
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - id: pins
        run: echo "mruby=$(git rev-parse HEAD:app/web/runtime/mruby)" >> "$GITHUB_OUTPUT"
      - name: Cache mruby
        uses: actions/cache@v4
        with:
          path: app/web/build/mruby   # relative to the repository root: actions ignore the run steps' working directory
          # everything mruby is built from (scripts/build-runtime.sh, FROM), the gems it compiles in included
          key: mruby-wasm-${{ steps.pins.outputs.mruby }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('app/web/runtime/build_config.rb', 'app/web/runtime/mruby-patches/**', 'app/web/runtime/mrbgems/**') }}
      - name: Build the runtime
        run: scripts/build-runtime.sh
      - name: Run the specs on the wasm runtime
        run: ADAPTER="node $PWD/runtime/bin/trace-wasm.mjs" ruby scripts/check.rb
      - name: Run the live session check
        run: node runtime/bin/live-check.mjs
      - name: Check card decks and which runs count as live
        run: node scripts/deck-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sp_runtime
          path: |
            app/web/build/runtime/sp_runtime.wasm
            app/web/build/runtime/sp_runtime.mjs
          if-no-files-found: error

  # ── the web's generated data must match the Ruby server it is generated from ─────────────────────────
  data:
    name: Generated data matches the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Check the committed data matches a fresh generation
        run: |
          ruby scripts/gen-synth-data.rb     # reads ../server/ruby, writes runtime/data
          ruby scripts/gen-editor-data.rb    # reads the docs and etc/, writes web/data
          git diff --exit-code runtime/data web/data \
            || { echo "::error::the data no longer matches the server it is generated from — regenerate and commit it"; exit 1; }
      - name: Check each opt's validation matches the server's
        run: ruby scripts/check-validations.rb

  # ── the web app and website in real browsers ─────────────────────────────────────────────────────────────────
  app:
    name: Browser tests (Chromium, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        # a pinned version from emsdk's own repository, so a compiler update cannot change the wasm unnoticed
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Build the tutorial from this repository's docs
        # qt-doc.rb builds the tutorial from etc/doc/tutorial and web-tutorial.rb turns it into web pages, so the
        # tests use this repository's tutorial rather than the one on the website.
        working-directory: app/server/ruby
        run: |
          ruby bin/qt-doc.rb
          ruby bin/web-tutorial.rb
      - name: Build the runtime, the site and the app
        run: |
          scripts/build-runtime.sh
          node scripts/build-site.mjs
          node scripts/build-app.mjs
      - name: Unit tests
        # app/src modules tested in Node: the workspace, set files byte for byte against native's format
        # (fixtures/set-bundle.json), share links, shortcuts, and the live core on the runtime just built
        run: npm test
      - name: Check the example specs match the examples
        run: npm run check:examples
      - name: Start the local server
        # plain http is enough: browsers treat localhost as secure, so the audio worklet runs, and serve.mjs sends
        # the cross-origin isolation headers itself (--https is only for testing from a phone on the LAN)
        run: |
          node scripts/serve.mjs > serve.log 2>&1 &
          until curl -s http://localhost:8460/web/ -o /dev/null; do sleep 1; done
      - name: Run the browser checks in Chromium and WebKit
        run: node scripts/browser-check.mjs http://localhost:8460/web/
      - if: failure()
        run: cat serve.log

  # ── the website package, as deployed ─────────────────────────────────────────────────────────────────────────
  #
  # Builds the zip that sonic-pi.net serves: package-web.mjs's sonic-pi-web/ folder (with SuperSonic from the CDN,
  # at the version package.json pins) and the nginx.conf lines it needs. Runs only after the wasm and browser jobs
  # pass, so every uploaded package has been tested.
  site:
    name: Package the website
    needs: [wasm, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # the package is named from git describe (v5.1-beta1-12-gabc1234)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Install webp (for the video thumbnails)
        run: sudo apt-get install -y webp
      - run: npm ci
      - name: Build the tutorial from this repository's docs
        working-directory: app/server/ruby
        run: |
          ruby bin/qt-doc.rb
          ruby bin/web-tutorial.rb
      - name: Build the runtime
        run: scripts/build-runtime.sh
      - name: Build and package the site
        id: package
        run: |
          node scripts/package-web.mjs
          zip=$(ls build/sonic-pi-web-*.zip)
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
          # unzipped again, because GitHub zips every artifact itself: upload the folder, not our zip
          rm -rf build/site && mkdir -p build/site && unzip -q "$zip" -d build/site
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}   # sonic-pi-web-<git describe>, holding sonic-pi-web/ and nginx.conf
          path: app/web/build/site/
          if-no-files-found: error

  # ── the specs re-run on the Ruby server ─────────────────────────────────────────────────────────────────────
  #
  # Runs every spec on the real Ruby server to check the recorded traces still match what the server does. A
  # change to the server's behaviour fails here on purpose: the runtime and the recorded traces have to be
  # updated together. A spec that is racy on the server says so in its header and is retried before it counts
  # as a failure. FREE_TOLERANCE is raised because an fx's free is timed by the wall clock, not logical time, and
  # a busy CI runner runs later than a laptop.
  oracle:
    name: Specs re-run on the Ruby server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Build aubio_onset (the server uses it to find sample onsets)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libsndfile1-dev
          scripts/build-oracle.sh
      - run: FREE_TOLERANCE=0.5 ruby scripts/check.rb
