[package]
name = "sonic-pi-plugin"
version = "0.2.1"
edition = "2024"
# It links Sonic Pi's runtime (AGPL), SuperSonic's front and scsynth (GPL) and
# Clockwork (AGPL or commercial).
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "core/lib.rs"
# cdylib: the VST3 binary. rlib: the tests (test/), which drive an instance
# offline, rendering by hand as a host does.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "sound"
path = "test/sound.rs"

[[test]]
name = "offline"
path = "test/offline.rs"

[[test]]
name = "ahead"
path = "test/ahead.rs"

[dependencies]
raw-window-handle = "0.6"
wry = "0.57"
serde_json = "1"
# The engine in this process. clockwork-sys builds SuperSonic's CMake tree
# (.cargo/config.toml) and links the C++: Clockwork and the scsynth guest.
# clockwork-native is the Rust half; the DAW is the device, the MIDI and the
# clock, so its subsystems for those are left out (and off in the CMake).
clockwork-native = { path = "../external/supersonic/clockwork/rust/clockwork-native", default-features = false, features = ["schedule"] }
clockwork-sys = { path = "../external/supersonic/clockwork/rust/clockwork-sys" }

[build-dependencies]
cc = "1"
serde_json = "1"

[patch.crates-io]
# Clockwork's decoder rides a patched FLAC bundle (clockwork/rust/Cargo.toml).
symphonia-bundle-flac = { path = "../external/supersonic/clockwork/external/symphonia-bundle-flac" }
# objc2 with each copy of the plugin in a process making its own Objective-C classes (external/README.md).
objc2 = { path = "external/objc2" }

[profile.release]
lto = "fat"
codegen-units = 1
# Not stripped by cargo. Rust 1.96 strips a release library by default and left this one with a string table
# at an offset that is not a multiple of 8, which macOS 27's loader refuses ("mis-aligned LINKEDIT string
# pool"): the arm64 half of a universal build would not load. The symbols also make a crash report readable.
strip = "none"

# A stripped proc-macro dylib has lost the metadata rustc loads it by.
[profile.release.build-override]
strip = false
